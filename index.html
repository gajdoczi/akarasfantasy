<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RIFT DRAFT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap');

:root{
  --bg:#080b10;
  --bg-panel:#0e131b;
  --bg-panel2:#131a24;
  --line:#232c38;
  --teal:#0ac8b9;
  --teal-dim:#0a8f86;
  --gold:#c8aa6e;
  --gold-bright:#f0e6d2;
  --danger:#e8495f;
  --text:#cdd6e0;
  --text-dim:#7c8898;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:'Rajdhani',sans-serif;}
body{padding:0;}
.app{
  background:radial-gradient(ellipse at 50% -10%, #101a22 0%, var(--bg) 55%);
  border:1px solid var(--line);
  min-height:100vh;
  padding-bottom:60px;
}

/* ---------- HEADER ---------- */
.header{
  padding:22px 28px 0 28px;
  position:relative;
}
.brand{
  display:flex; align-items:baseline; gap:12px;
  font-family:'Cinzel',serif;
}
.brand h1{
  font-size:26px; letter-spacing:3px; margin:0; font-weight:900;
  color:var(--gold-bright);
  text-shadow:0 0 18px rgba(200,170,110,.35);
}
.brand .sub{ font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase;}

.region-row{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
.region-tabs{ display:flex; gap:8px; }
.region-tab{
  font-family:'Cinzel',serif; font-weight:700; font-size:13px; letter-spacing:2px;
  padding:9px 18px; border-radius:3px; cursor:pointer; user-select:none;
  border:1px solid var(--line); background:var(--bg-panel); color:var(--text-dim);
  transition:all .15s ease;
}
.region-tab:hover{ color:var(--gold-bright); border-color:var(--gold); }
.region-tab.active{
  color:#0a0e13; background:linear-gradient(180deg,var(--rc,var(--gold)) 0%, var(--rc-dim,var(--gold-bright)) 100%);
  border-color:var(--rc,var(--gold));
  box-shadow:0 0 16px var(--rc,var(--gold));
}
.split-select{
  font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; letter-spacing:1px;
  background:var(--bg-panel); color:var(--text); border:1px solid var(--line); border-radius:3px;
  padding:9px 12px; cursor:pointer;
}
.split-select:focus{ outline:1px solid var(--teal); }

/* ---------- ESSENCE METER ---------- */
.essence-wrap{ padding:18px 28px 0 28px; }
.essence-label{ display:flex; justify-content:space-between; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px;}
.essence-label b{ color:var(--gold-bright); font-weight:700; }
.essence-bar{
  height:14px; border-radius:2px; background:var(--bg-panel); border:1px solid var(--line);
  overflow:hidden; position:relative;
}
.essence-fill{
  height:100%;
  background:linear-gradient(90deg, var(--teal-dim), var(--teal));
  box-shadow:0 0 12px var(--teal);
  transition:width .25s ease, background .25s ease;
}
.essence-fill.over{ background:linear-gradient(90deg,#7a1f2b,var(--danger)); box-shadow:0 0 12px var(--danger); }

/* ---------- ROSTER SLOTS ---------- */
.roster-row{
  display:grid; grid-template-columns:repeat(6,1fr); gap:10px;
  padding:18px 28px 0 28px;
}
.slot{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:6px;
  min-height:132px; padding:10px; position:relative; cursor:default;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  transition:border-color .15s ease;
}
.slot.filled{ border-color:var(--gold); background:linear-gradient(180deg, rgba(200,170,110,.08), transparent); cursor:pointer;}
.slot.filled:hover{ border-color:var(--danger); }
.slot .role-tag{ font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; margin-bottom:6px;}
.slot .role-icon{ width:26px; height:26px; margin-bottom:6px; opacity:.55;}
.slot.filled .role-icon{ opacity:.9; }
.slot .pname{ font-weight:700; font-size:14px; color:var(--gold-bright); line-height:1.15;}
.slot .pteam{ font-size:11px; color:var(--text-dim); margin-top:2px;}
.slot .pcost{ margin-top:6px; font-size:12px; font-weight:700; color:var(--teal); }
.slot .empty-txt{ font-size:11px; color:var(--text-dim); }
.slot .remove-x{
  position:absolute; top:6px; right:8px; font-size:12px; color:var(--text-dim); display:none;
}
.slot.filled:hover .remove-x{ display:block; color:var(--danger); }

/* ---------- ACTIONS ---------- */
.actions-row{ display:flex; gap:10px; padding:16px 28px 0 28px; flex-wrap:wrap; align-items:center;}
.btn{
  font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:1px; font-size:13px;
  padding:10px 18px; border-radius:3px; border:1px solid var(--line); background:var(--bg-panel);
  color:var(--text); cursor:pointer; transition:all .15s ease; text-transform:uppercase;
}
.btn:hover{ border-color:var(--teal); color:var(--teal); }
.btn.primary{ background:linear-gradient(180deg,var(--teal),var(--teal-dim)); color:#06141a; border-color:var(--teal); }
.btn.primary:hover{ filter:brightness(1.1); color:#06141a;}
.btn.ghost{ background:transparent; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.save-msg{ font-size:12px; color:var(--teal); letter-spacing:1px; }

/* ---------- FILTER BAR ---------- */
.filter-bar{
  display:flex; gap:8px; padding:22px 28px 0 28px; flex-wrap:wrap; align-items:center;
  border-top:1px solid var(--line); margin-top:20px; padding-top:20px;
}
.chip{
  font-size:12px; letter-spacing:1px; font-weight:600; padding:7px 14px; border-radius:20px;
  border:1px solid var(--line); background:var(--bg-panel); color:var(--text-dim); cursor:pointer;
}
.chip.active{ color:#06141a; background:var(--gold); border-color:var(--gold); }
.search-input{
  margin-left:auto; background:var(--bg-panel); border:1px solid var(--line); border-radius:20px;
  padding:7px 14px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:13px; min-width:180px;
}
.sort-select{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:20px; color:var(--text-dim);
  font-family:'Rajdhani',sans-serif; font-size:12px; padding:7px 10px;
}

/* ---------- PLAYER GRID ---------- */
.team-block{ padding:22px 28px 0 28px; }
.team-name{
  font-family:'Cinzel',serif; font-size:14px; letter-spacing:2px; color:var(--gold);
  margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.team-name .line{ flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
.player-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;}
.pcard{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; padding:12px;
  display:flex; flex-direction:column; gap:6px; transition:border-color .15s ease;
}
.pcard:hover{ border-color:var(--teal-dim); }
.pcard.owned{ border-color:var(--gold); background:linear-gradient(180deg, rgba(200,170,110,.07), transparent);}
.pcard-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.pcard-name{ font-weight:700; color:var(--gold-bright); font-size:15px; }
.pcard-role{ font-size:10px; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; }
.tier-badge{
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:3px; letter-spacing:1px;
}
.tier-S{ background:rgba(232,73,95,.18); color:#ff7a8c; border:1px solid #ff7a8c55;}
.tier-A{ background:rgba(200,170,110,.18); color:var(--gold-bright); border:1px solid var(--gold);}
.tier-B{ background:rgba(10,200,185,.14); color:var(--teal); border:1px solid var(--teal-dim);}
.tier-C{ background:rgba(124,136,152,.14); color:var(--text-dim); border:1px solid var(--line);}
.pcard-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:4px;}
.pcard-cost{ font-weight:700; color:var(--teal); font-size:14px;}
.pcard-add{
  font-size:11px; font-weight:700; letter-spacing:1px; padding:5px 12px; border-radius:3px; cursor:pointer;
  background:var(--bg-panel2); border:1px solid var(--line); color:var(--text);
}
.pcard-add:hover:not(:disabled){ border-color:var(--teal); color:var(--teal); }
.pcard-add:disabled{ opacity:.3; cursor:not-allowed;}
.pcard-add.remove{ border-color:var(--danger); color:var(--danger); }
.cost-edit{ width:52px; background:var(--bg-panel2); border:1px solid var(--line); color:var(--gold-bright);
  font-family:'Rajdhani',sans-serif; font-weight:700; border-radius:3px; padding:2px 4px; font-size:13px;}

/* ---------- EDIT / CUSTOM PANEL ---------- */
.edit-panel{ padding:20px 28px 0 28px; }
.edit-note{ font-size:12px; color:var(--text-dim); line-height:1.6; max-width:640px; }
.add-player-form{
  display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center;
  background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; padding:12px;
}
.add-player-form input, .add-player-form select{
  background:var(--bg-panel2); border:1px solid var(--line); color:var(--text);
  font-family:'Rajdhani',sans-serif; padding:7px 10px; border-radius:3px; font-size:13px;
}
.add-player-form input[type=text]{ width:130px; }
.add-player-form input[type=number]{ width:70px; }

.footer-note{ padding:26px 28px 0 28px; font-size:11px; color:var(--text-dim); line-height:1.7; max-width:720px;}

/* ---------- LOGIN / IDENTITY ---------- */
.login-bar{ display:flex; align-items:center; gap:8px; }
.login-bar input{
  background:var(--bg-panel); border:1px solid var(--line); color:var(--text);
  font-family:'Rajdhani',sans-serif; padding:8px 12px; border-radius:3px; font-size:13px; width:140px;
}
.identity-chip{
  display:flex; align-items:center; gap:8px; background:var(--bg-panel); border:1px solid var(--gold);
  border-radius:20px; padding:6px 8px 6px 14px; font-size:13px; font-weight:600; color:var(--gold-bright);
}
.identity-chip .logout{ font-size:11px; color:var(--text-dim); cursor:pointer; border-left:1px solid var(--line); padding-left:8px; }
.identity-chip .logout:hover{ color:var(--danger); }
.identity-chip .email{ font-size:11px; color:var(--text-dim); }
.login-msg{ font-size:11px; color:var(--danger); }
.auth-toggle{ font-size:11px; color:var(--teal); cursor:pointer; text-decoration:underline; white-space:nowrap; }
.auth-toggle:hover{ color:var(--gold-bright); }
.login-bar input[type="email"]{ width:170px; }
.login-bar input[type="password"]{ width:130px; }

/* ---------- POINTS BADGE ---------- */
.points-badge{
  display:inline-flex; align-items:baseline; gap:6px; margin-left:14px; padding:4px 12px;
  border:1px solid var(--teal-dim); border-radius:20px; background:rgba(10,200,185,.08);
}
.points-badge b{ color:var(--teal); font-size:15px; }
.points-badge span{ font-size:10px; letter-spacing:1px; color:var(--text-dim); text-transform:uppercase; }

/* ---------- SECTION TABS (Draft / Matches / Leaderboard) ---------- */
.section-tabs{ display:flex; gap:6px; padding:22px 28px 0 28px; border-top:1px solid var(--line); margin-top:22px; padding-top:18px; }
.section-tab{
  font-family:'Cinzel',serif; font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  padding:8px 16px; cursor:pointer; color:var(--text-dim); border-bottom:2px solid transparent;
}
.section-tab.active{ color:var(--gold-bright); border-bottom-color:var(--gold); }

/* ---------- MATCH CENTER ---------- */
.match-panel{ padding:18px 28px 0 28px; }
.match-form{
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; padding:14px; margin-bottom:16px;
}
.match-form select, .match-form input{
  background:var(--bg-panel2); border:1px solid var(--line); color:var(--text);
  font-family:'Rajdhani',sans-serif; padding:7px 10px; border-radius:3px; font-size:13px;
}
.match-list{ display:flex; flex-direction:column; gap:8px; }
.match-row{
  display:flex; align-items:center; gap:14px; background:var(--bg-panel); border:1px solid var(--line);
  border-radius:6px; padding:10px 14px; font-size:13px;
}
.match-row .mteams{ flex:1; }
.match-row .winner{ color:var(--teal); font-weight:700; }
.match-row .mvp{ color:var(--gold-bright); font-size:12px; }
.match-row .mweek{ color:var(--text-dim); font-size:11px; min-width:70px; }
.match-row .mdel{ cursor:pointer; color:var(--text-dim); font-size:12px; }
.match-row .mdel:hover{ color:var(--danger); }
.rules-note{ font-size:12px; color:var(--text-dim); margin-bottom:14px; line-height:1.6; }

/* ---------- LEADERBOARD ---------- */
.lb-panel{ padding:18px 28px 0 28px; }
.lb-table{ width:100%; border-collapse:collapse; }
.lb-table th{
  text-align:left; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim);
  border-bottom:1px solid var(--line); padding:8px 10px; font-weight:600;
}
.lb-table td{ padding:10px; border-bottom:1px solid var(--line); font-size:14px; }
.lb-table tr.me{ background:rgba(200,170,110,.08); }
.lb-rank{ font-family:'Cinzel',serif; font-weight:700; color:var(--gold); width:36px; }
.lb-points{ color:var(--teal); font-weight:700; }
.lb-empty{ color:var(--text-dim); font-size:13px; padding:16px 0; }
.disclaimer{
  margin:20px 28px 0 28px; padding:12px 16px; border:1px solid #4a3a1e; background:rgba(200,170,110,.06);
  border-radius:6px; font-size:12px; color:var(--gold-bright); line-height:1.6;
}

@media (max-width:720px){
  .roster-row{ grid-template-columns:repeat(3,1fr); }
  .header, .essence-wrap, .roster-row, .actions-row, .filter-bar, .team-block, .edit-panel, .footer-note, .disclaimer{ padding-left:14px; padding-right:14px; }
}
</style>

/* ============================================================
   STORAGE (localStorage-backed, works when the file is opened
   directly in a browser — no external storage service needed)
   ============================================================ */
const LS_PREFIX = "riftdraft:";
const storage = {
  async get(key){
    try{
      const raw = localStorage.getItem(LS_PREFIX+key);
      if(raw === null) return null;
      return { key, value: raw };
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      localStorage.setItem(LS_PREFIX+key, value);
      return { key, value };
    }catch(e){ return null; }
  },
  async delete(key){
    try{
      localStorage.removeItem(LS_PREFIX+key);
      return { key, deleted:true };
    }catch(e){ return null; }
  },
  async list(prefix){
    try{
      const full = LS_PREFIX+(prefix||"");
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(full)===0) keys.push(k.slice(LS_PREFIX.length));
      }
      return { keys, prefix };
    }catch(e){ return null; }
  }
};

/* ---------- TEAM POWER RANKINGS ----------
   A team's Blue Essence cost is derived from its power ranking within
   its region — best to worst — then bucketed into the same S/A/B/C
   scale (and BE cost) used for individual players. The order below is
   the stated power ranking for each region. Any team not listed here
   (e.g. a club added later via Edit Roster Data) is ranked by its
   roster's combined tier strength and slotted in after the named list. */
const TEAM_POWER_RANKING = {
  LPL: ["Bilibili Gaming","Anyone's Legend","Top Esports","JD Gaming","Team WE","Invictus Gaming","Weibo Gaming","Ninjas in Pyjamas","LGD Gaming","LNG Esports","ThunderTalk Gaming","EDward Gaming"],
  LCK: ["Hanwha Life Esports","Gen.G","T1","KT Rolster","Dplus KIA","Nongshim RedForce","BNK FEARX","HANJIN BRION","Kiwoom DRX","DN SOOPers"],
  LEC: ["G2 Esports","Karmine Corp","Team Vitality","Movistar KOI","Natus Vincere","Fnatic","SK Gaming","GIANTX","Shifters","Team Heretics"]
};

function teamPowerScore(region, team){
  const players = teamsForRegion(region)[team] || [];
  return players.reduce((sum,p)=> sum + (TIER_VALUE[p.tier] || 0), 0);
}

function rankedTeams(region){
  const known = TEAM_POWER_RANKING[region] || [];
  const allTeams = Object.keys(teamsForRegion(region));
  const ranked = known
    .filter(team => allTeams.includes(team))
    .map(team => ({ team, score: teamPowerScore(region, team) }));
  const extras = allTeams
    .filter(team => !known.includes(team))
    .map(team => ({ team, score: teamPowerScore(region, team) }))
    .sort((a,b) => b.score - a.score);
  return ranked.concat(extras);
}

function teamTierFor(region, team){
  const ranked = rankedTeams(region);
  const idx = ranked.findIndex(r => r.team === team);
  if(idx === -1 || ranked.length === 0) return "C";
  const pct = idx / ranked.length; // 0 = strongest team
  if(pct < 0.2) return "S";
  if(pct < 0.45) return "A";
  if(pct < 0.75) return "B";
  return "C";
}

function teamCostOf(region, team){
  return TIER_COST[teamTierFor(region, team)];
}

function rosterKey(){ return "roster:"+state.region+":"+state.split; }

function pointsForRoster(roster, matches){
  let pts = 0;
  const owned = Object.values(roster).filter(Boolean);
  owned.forEach(p=>{
    matches.forEach(m=>{
      if(m.winner && p.team === m.winner) pts += POINTS_WIN;
      if(m.mvpId && p.id === m.mvpId) pts += POINTS_MVP;
    });
  });
  return pts;
}

function myPoints(){
  return pointsForRoster(state.roster, state.matches);
}

function spentTotal(){
  let sum = 0;
  ROLES.forEach(r=>{
    const p = state.roster[r];
    if(p) sum += costOf(p);
  });
  const t = state.roster.TEAM;
  if(t) sum += teamCostOf(t.region, t.team);
  return sum;
}

function findPlayerById(id){
  for(const region in DATA){
    for(const t of DATA[region]){
      const f = t.players.find(p=>p.id===id);
      if(f) return f;
    }
  }
  return state.customPlayers.find(p=>p.id===id) || null;
}

/* ---------- IDENTITY / EMAIL AUTH ----------
   Note: this is a self-contained HTML file with no server, so there is
   no real mail service to send a verification link through. Passwords
   are salted and hashed with SHA-256 before being stored, but this is
   still local, client-side "auth" — good enough to keep casual users'
   profiles separate, not a substitute for real backend authentication. */
function genSalt(){
  if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return "salt-"+Math.random().toString(36).slice(2)+Date.now();
}

async function hashPassword(password, salt){
  const enc = new TextEncoder();
  const data = enc.encode(salt+":"+password);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function signup(email, password, name){
  state.authMsg = "";
  email = (email||"").trim().toLowerCase();
  name = (name||"").trim();
  if(!isValidEmail(email)){ state.authMsg = "Enter a valid email address."; render(); return; }
  if(!password || password.length < 6){ state.authMsg = "Password must be at least 6 characters."; render(); return; }
  if(!name){ state.authMsg = "Enter a display name."; render(); return; }
  if(name.length > 20){ state.authMsg = "Keep the display name under 20 characters."; render(); return; }
  try{
    const existing = await storage.get(accountKey(email), true);
    if(existing && existing.value){ state.authMsg = "An account with that email already exists — log in instead."; render(); return; }
    const salt = genSalt();
    const passHash = await hashPassword(password, salt);
    const account = { email, name, salt, passHash, createdAt: Date.now() };
    await storage.set(accountKey(email), JSON.stringify(account), true);
    await storage.set(sessionKey(), JSON.stringify({ email }));
    state.user = { email, name };
    state.authEmail = ""; state.authPassword = ""; state.authName = ""; state.authMsg = "";
    await syncLeaderboard();
  }catch(e){
    state.authMsg = "Couldn't reach storage — try again.";
  }
  render();
}

async function login(email, password){
  state.authMsg = "";
  email = (email||"").trim().toLowerCase();
  if(!email || !password){ state.authMsg = "Enter your email and password."; render(); return; }
  try{
    const existing = await storage.get(accountKey(email), true);
    if(!existing || !existing.value){ state.authMsg = "No account found for that email."; render(); return; }
    const account = JSON.parse(existing.value);
    const passHash = await hashPassword(password, account.salt);
    if(passHash !== account.passHash){ state.authMsg = "Incorrect email or password."; render(); return; }
    await storage.set(sessionKey(), JSON.stringify({ email }));
    state.user = { email: account.email, name: account.name };
    state.authEmail = ""; state.authPassword = ""; state.authMsg = "";
    await syncLeaderboard();
  }catch(e){
    state.authMsg = "Couldn't reach storage — try again.";
  }
  render();
}

  try{ storage.delete(sessionKey()); }catch(e){}

async function loadLeaderboard(){

      const entries = [];
      for(const k of list.keys){
        try{
          const v = await storage.get(k, true);

        }catch(e){}

      entries.sort((a,b)=> b.points - a.points);
      state.leaderboard = entries;
    }
  }catch(e){}
}


/* ============================================================
   ACTIONS
   ============================================================ */
function slotForRole(role){
  // one player per starter role — no flex duplicate anymore, that's now the TEAM slot
  if(!state.roster[role]) return role;
  return null;
}

function isOwned(p){
  return Object.values(state.roster).some(x => x && x.id === p.id);
}

function countFromTeam(team){
  // only the 5 player role slots count toward the per-club player cap;
  // the TEAM slot holds a whole club, not a player
  return ROLES.filter(r => state.roster[r] && state.roster[r].team === team).length;
}

function teamCapReached(p){
  return !isOwned(p) && countFromTeam(p.team) >= MAX_PER_TEAM;
}

function addPlayer(p){
  const slot = slotForRole(p.role);
  if(!slot) return;
  const newSpent = spentTotal() + costOf(p);
  if(newSpent > budgetCap()) return;
  if(teamCapReached(p)) return;
  state.roster[slot] = p;
  render();
}

function addTeamToSlot(team){
  if(state.roster.TEAM) return;
  const cost = teamCostOf(state.region, team);
  const newSpent = spentTotal() + cost;
  if(newSpent > budgetCap()) return;
  state.roster.TEAM = { __kind:"team", region: state.region, team };
  render();
}

function removeFromSlot(slot){
  state.roster[slot] = null;
  render();
}

function removePlayerEverywhere(p){
  Object.keys(state.roster).forEach(slot=>{
    if(state.roster[slot] && state.roster[slot].id === p.id) state.roster[slot] = null;
  });
  render();
}

        <div class="add-player-form">
          <input type="text" placeholder="Player name" id="np-name">
          <input type="text" placeholder="Team" id="np-team">
          <select id="np-role">${ROLES.map(r=>`<option value="${r}">${ROLE_LABEL[r]}</option>`).join("")}</select>
          <select id="np-tier">${Object.keys(TIER_COST).map(t=>`<option value="${t}">${t} tier</option>`).join("")}</select>
          <input type="number" id="np-cost" placeholder="Cost" min="1" max="30">
          <button class="btn primary" data-action="addcustom">Add Player</button>
        </div>
      </div>`;
  }

  // section tabs
  html += `
    <div class="section-tabs">
      <div class="section-tab ${state.section==='draft'?'active':''}" data-action="section" data-section="draft">Draft Pool</div>
      <div class="section-tab ${state.section==='matches'?'active':''}" data-action="section" data-section="matches">Match Center</div>
      <div class="section-tab ${state.section==='leaderboard'?'active':''}" data-action="section" data-section="leaderboard">Leaderboard</div>
    </div>`;

  if(state.section === "draft"){
    // filter bar
    html += `
      <div class="filter-bar">
        ${["ALL"].concat(ROLES).map(r=>`<div class="chip ${state.filterRole===r?'active':''}" data-action="filter" data-role="${r}">${r==='ALL'?'All Roles':ROLE_LABEL[r]}</div>`).join("")}
        <select class="sort-select" data-action="sort">
          <option value="team" ${state.sort==='team'?'selected':''}>Sort: Team</option>
          <option value="cost-desc" ${state.sort==='cost-desc'?'selected':''}>Sort: Cost (High→Low)</option>
          <option value="cost-asc" ${state.sort==='cost-asc'?'selected':''}>Sort: Cost (Low→High)</option>
          <option value="name" ${state.sort==='name'?'selected':''}>Sort: Name</option>
        </select>
        <input class="search-input" type="text" placeholder="Search player or team..." value="${state.search}" data-action="search">
      </div>`;

    // player list
    const teams = teamsForRegion(state.region);
    let teamNames = Object.keys(teams);

    if(state.sort === "team"){
      html += teamNames.map(tn => renderTeamBlock(tn, teams[tn], meta)).join("");
    } else {
      let flat = [];
      teamNames.forEach(tn => teams[tn].forEach(p => flat.push(p)));
      flat = filterPlayers(flat);
      if(state.sort==="cost-desc") flat.sort((a,b)=>costOf(b)-costOf(a));
      if(state.sort==="cost-asc") flat.sort((a,b)=>costOf(a)-costOf(b));
      if(state.sort==="name") flat.sort((a,b)=>a.name.localeCompare(b.name));
      html += `<div class="team-block"><div class="player-grid">${flat.map(p=>renderCard(p)).join("")}</div></div>`;
    }
  } else if(state.section === "matches"){
    html += renderMatchPanel(meta);
  } else if(state.section === "leaderboard"){
    html += renderLeaderboardPanel();
  }

  html += `
    <div class="footer-note">Win points (+${POINTS_WIN}) are awarded to every rostered player whose real-world club wins a logged match; MVP points (+${POINTS_MVP}) go to whichever player is tagged MVP for that match. Match results are entered by hand in the Match Center — there's no live official results feed wired in, so keep it up to date as the split plays out. All data (squads, matches, custom players, edits) is saved in this browser's local storage on this device — nothing is sent anywhere, and clearing your browser data will reset it.</div>
  </div>`;

  root.innerHTML = html;
  attachHandlers();
}

function filterPlayers(list){
  let out = list;
  if(state.filterRole !== "ALL") out = out.filter(p=>p.role===state.filterRole);
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    out = out.filter(p=> p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q));
  }
  return out;
}

function renderMatchPanel(meta){
  const teamNames = Object.keys(teamsForRegion(state.region)).sort();
  const f = state.matchForm;
  const candidateTeams = [f.team1, f.team2].filter(Boolean);
  const mvpCandidates = candidateTeams.length
    ? allPlayersForRegion(state.region).filter(p => candidateTeams.includes(p.team))
    : [];

  let html = `<div class="match-panel">`;
  html += `<div class="rules-note">Log each match's winner and (optionally) its MVP. Points apply automatically to everyone's saved squads for ${state.region} — ${state.split}.</div>`;
  html += `
    <div class="match-form">
      <input type="text" id="mf-week" placeholder="Week / Day" value="${f.week}" style="width:100px;">
      <select id="mf-team1">
        <option value="">Team A</option>
        ${teamNames.map(t=>`<option value="${t}" ${f.team1===t?'selected':''}>${t}</option>`).join("")}
      </select>
      <select id="mf-team2">
        <option value="">Team B</option>
        ${teamNames.map(t=>`<option value="${t}" ${f.team2===t?'selected':''}>${t}</option>`).join("")}
      </select>
      <select id="mf-winner">
        <option value="">Winner</option>
        ${candidateTeams.map(t=>`<option value="${t}" ${f.winner===t?'selected':''}>${t}</option>`).join("")}
      </select>
      <select id="mf-mvp">
        <option value="">MVP (optional)</option>
        ${mvpCandidates.map(p=>`<option value="${p.id}" ${f.mvpId===p.id?'selected':''}>${p.name} (${p.team})</option>`).join("")}
      </select>
      <button class="btn primary" data-action="addmatch" ${(!f.team1||!f.team2||!f.winner||f.team1===f.team2)?'disabled':''}>Log Match</button>
    </div>`;

  if(state.matches.length === 0){
    html += `<div class="lb-empty">No matches logged yet for this split.</div>`;
  } else {
    const sorted = state.matches.slice().reverse();
    html += `<div class="match-list">`;
    sorted.forEach(m=>{
      html += `
        <div class="match-row">
          <span class="mweek">${m.week || "—"}</span>
          <span class="mteams">${m.team1} <span style="color:var(--text-dim)">vs</span> ${m.team2} — <span class="winner">${m.winner} won</span></span>
          <span class="mvp">${m.mvpName ? "MVP: "+m.mvpName : ""}</span>
          <span class="mdel" data-action="delmatch" data-id="${m.id}">✕ remove</span>
        </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function renderLeaderboardPanel(){
  let html = `<div class="lb-panel">`;
  html += `<div class="rules-note">Ranking for ${state.region} — ${state.split}. Sign up or log in and save a squad to appear here; your points update automatically whenever you save your roster or matches change. Everything is saved locally in this browser, so this leaderboard only shows squads you've saved from this device.</div>`;
  if(state.leaderboard.length === 0){
    html += `<div class="lb-empty">No one has saved a squad for this region and split yet.</div>`;
  } else {
    html += `<table class="lb-table"><thead><tr><th>#</th><th>Manager</th><th>Squad Size</th><th>Points</th></tr></thead><tbody>`;
    state.leaderboard.forEach((e,i)=>{
      const isMe = state.user && e.email && e.email.toLowerCase() === state.user.email.toLowerCase();
      html += `<tr class="${isMe?'me':''}"><td class="lb-rank">${i+1}</td><td>${e.name || e.email}${isMe?' (you)':''}</td><td>${e.squadSize}/6</td><td class="lb-points">${e.points}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;
  return html;
}

function renderTeamBlock(teamName, players, meta){
  let list = filterPlayers(players);
  if(state.sort==="cost-desc") list = list.slice().sort((a,b)=>costOf(b)-costOf(a));
  if(state.sort==="cost-asc") list = list.slice().sort((a,b)=>costOf(a)-costOf(b));
  if(state.sort==="name") list = list.slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(list.length===0) return "";
  return `
    <div class="team-block">
      <div class="team-name">${teamName}<span class="line"></span></div>
      <div class="player-grid">${list.map(p=>renderCard(p)).join("")}</div>
    </div>`;
}

function renderCard(p){
  const owned = isOwned(p);
  const slot = slotForRole(p.role);
  const cost = costOf(p);
  const wouldExceed = (spentTotal() - (owned?cost:0) + cost) > budgetCap();
  const capped = teamCapReached(p);
  const disable = owned ? false : (!slot || wouldExceed || capped);
  let label = "Draft";
  if(owned) label = "Drop";
  else if(!slot) label = "Full";
  else if(capped) label = `Max ${MAX_PER_TEAM}/club`;
  else if(wouldExceed) label = "Over cap";
  return `
    <div class="pcard ${owned?'owned':''}">
      <div class="pcard-top">
        <div>
          <div class="pcard-name">${p.name}</div>
          <div class="pcard-role">${p.team} · ${ROLE_LABEL[p.role]}</div>
        </div>
        <span class="tier-badge tier-${p.tier}">${p.tier}</span>
      </div>
      <div class="pcard-bottom">
        ${state.editMode
          ? `<input class="cost-edit" type="number" value="${cost}" data-action="editcost" data-id="${p.id}">`
          : `<div class="pcard-cost">${cost} BE</div>`}
        <button class="pcard-add ${owned?'remove':''}" data-action="${owned?'removeplayer':'addplayer'}" data-id="${p.id}" ${disable?'disabled':''}>
          ${label}
        </button>
      </div>
    </div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function attachHandlers(){
  document.querySelectorAll('[data-action="region"]').forEach(el=>{
    el.addEventListener("click", async ()=>{
      state.region = el.getAttribute("data-region");
      await saveLastView();
      await loadRoster();
      await loadMatches();
      await loadLeaderboard();
      render();
    });
  });
  const splitSel = document.querySelector('[data-action="split"]');
  if(splitSel) splitSel.addEventListener("change", async (e)=>{
    state.split = e.target.value;
    await saveLastView();
    await loadRoster();
    await loadMatches();
    await loadLeaderboard();
    render();
  });

  document.querySelectorAll('[data-action="removeslot"]').forEach(el=>{
    el.addEventListener("click", ()=> removeFromSlot(el.getAttribute("data-slot")));
  });

  const teamPickSel = document.querySelector('[data-action="teamselect"]');
  if(teamPickSel) teamPickSel.addEventListener("change", (e)=>{
    const team = e.target.value;
    if(team) addTeamToSlot(team);
  });

  document.querySelectorAll('[data-action="addplayer"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const p = findPlayerById(el.getAttribute("data-id"));
      if(p) addPlayer(p);
    });
  });
  document.querySelectorAll('[data-action="removeplayer"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const p = findPlayerById(el.getAttribute("data-id"));
      if(p) removePlayerEverywhere(p);
    });
  });

  const saveBtn = document.querySelector('[data-action="save"]');
  if(saveBtn) saveBtn.addEventListener("click", saveRoster);
  const clearBtn = document.querySelector('[data-action="clear"]');
  if(clearBtn) clearBtn.addEventListener("click", clearRoster);
  const editBtn = document.querySelector('[data-action="edit"]');
  if(editBtn) editBtn.addEventListener("click", ()=>{ state.editMode = !state.editMode; render(); });

  document.querySelectorAll('[data-action="filter"]').forEach(el=>{
    el.addEventListener("click", ()=>{ state.filterRole = el.getAttribute("data-role"); render(); });
  });
  const sortSel = document.querySelector('[data-action="sort"]');
  if(sortSel) sortSel.addEventListener("change", (e)=>{ state.sort = e.target.value; render(); });
  const searchInput = document.querySelector('[data-action="search"]');
  if(searchInput){
    searchInput.addEventListener("input", (e)=>{
      state.search = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const again = document.querySelector('[data-action="search"]');
      if(again){ again.focus(); again.setSelectionRange(pos,pos); }
    });
  }

  document.querySelectorAll('[data-action="editcost"]').forEach(el=>{
    el.addEventListener("change", (e)=>{
      const id = el.getAttribute("data-id");
      const val = parseInt(e.target.value,10);
      if(!isNaN(val) && val>0){
        state.overrides[id] = val;
        saveOverrides();
        render();
      }
    });
  });

  const addCustomBtn = document.querySelector('[data-action="addcustom"]');
  if(addCustomBtn) addCustomBtn.addEventListener("click", ()=>{
    const name = document.getElementById("np-name").value.trim();
    const team = document.getElementById("np-team").value.trim();
    const role = document.getElementById("np-role").value;
    const tier = document.getElementById("np-tier").value;
    const costInput = document.getElementById("np-cost").value;
    const cost = costInput ? parseInt(costInput,10) : TIER_COST[tier];
    if(!name || !team) return;
    const id = pid(state.region, team, name);
    state.customPlayers.push({ id, region: state.region, team, role, name, tier, baseCost: cost });
    saveCustom();
    render();
  });

  // email auth (signup / login / logout)
  function submitAuth(){
    const email = document.getElementById("auth-email").value;
    const password = document.getElementById("auth-password").value;
    if(state.authMode === "signup"){
      const nameEl = document.getElementById("auth-name");
      signup(email, password, nameEl ? nameEl.value : "");
    } else {
      login(email, password);
    }
  }
  const authSubmitBtn = document.querySelector('[data-action="auth-submit"]');
  if(authSubmitBtn) authSubmitBtn.addEventListener("click", submitAuth);
  ["auth-email","auth-password","auth-name"].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const field = id === "auth-email" ? "authEmail" : (id === "auth-password" ? "authPassword" : "authName");
    el.addEventListener("input", (e)=>{ state[field] = e.target.value; });
    el.addEventListener("keydown", (e)=>{ if(e.key === "Enter") submitAuth(); });
  });
  const authToggleEl = document.querySelector('[data-action="auth-toggle"]');
  if(authToggleEl) authToggleEl.addEventListener("click", ()=>{
    state.authMode = state.authMode === "signup" ? "login" : "signup";
    state.authMsg = "";
    render();
  });
  const logoutEl = document.querySelector('[data-action="logout"]');
  if(logoutEl) logoutEl.addEventListener("click", logout);

  // section tabs
  document.querySelectorAll('[data-action="section"]').forEach(el=>{
    el.addEventListener("click", ()=>{ state.section = el.getAttribute("data-section"); render(); });
  });

  // match center
  ["mf-week","mf-team1","mf-team2","mf-winner","mf-mvp"].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = { "mf-week":"week", "mf-team1":"team1", "mf-team2":"team2", "mf-winner":"winner", "mf-mvp":"mvpId" };
    const field = map[id];
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, (e)=>{
      state.matchForm[field] = e.target.value;
      if(field === "team1" || field === "team2"){
        if(state.matchForm.winner && state.matchForm.winner !== state.matchForm.team1 && state.matchForm.winner !== state.matchForm.team2){
          state.matchForm.winner = "";
        }
        state.matchForm.mvpId = "";
      }
      render();
    });
  });
  const addMatchBtn = document.querySelector('[data-action="addmatch"]');
  if(addMatchBtn) addMatchBtn.addEventListener("click", addMatch);
  document.querySelectorAll('[data-action="delmatch"]').forEach(el=>{
    el.addEventListener("click", ()=> deleteMatch(el.getAttribute("data-id")));
  });
}

/* ============================================================
   INIT
   ============================================================ */
loadAll().then(render);
</script>
</body>
</html>
